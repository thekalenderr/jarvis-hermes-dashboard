name: Build unsigned Jarvis IPA

on:
  push:
    branches: [feat/ios-mobile-app]
    paths: ['ios-app/**', '.github/workflows/ios-ipa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare UI test secret
        env:
          JARVIS_TEST_PASSWORD: ${{ secrets.JARVIS_TEST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os
          password = os.environ.get("JARVIS_TEST_PASSWORD", "")
          if not password:
              raise SystemExit("JARVIS_TEST_PASSWORD is missing")
          for path, enum_name in [
              ("JarvisMobileUITests/TestSecrets.swift", "TestSecrets"),
              ("JarvisMobileTests/UnitTestSecrets.swift", "UnitTestSecrets"),
          ]:
              with open(path, "w", encoding="utf-8") as f:
                  f.write("enum " + enum_name + " {\n    static let password = " + json.dumps(password) + "\n}\n")
          PY
      - name: Verify live Jarvis endpoint
        env:
          JARVIS_TEST_PASSWORD: ${{ secrets.JARVIS_TEST_PASSWORD }}
        run: curl --fail --silent --show-error --user "jarvis:${JARVIS_TEST_PASSWORD}" https://jarvis.50-6-36-201.sslip.io/api/status >/dev/null
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for runtime in d.values() for x in runtime if "iPhone" in x["name"]))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: xcodebuild test -project JarvisMobile.xcodeproj -scheme JarvisMobile -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device app
        run: xcodebuild build -project JarvisMobile.xcodeproj -scheme JarvisMobile -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/Jarvis.app
          /usr/bin/zip -qry Jarvis-Mobile-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Mobile-unsigned
          path: ios-app/Jarvis-Mobile-unsigned.ipa
          if-no-files-found: error
